{% extends 'base.html' %}

{% block content %}

<style>
body{
    background:#f5f5f5;
    color:#111;
}

.billing-wrapper{
    max-width:1100px;
    margin:auto;
}

.card-box{
    background:white;
    border:1px solid #ddd;
    border-radius:16px;
    padding:20px;
}

.table{
    color:#111;
}

.add-btn{
    width:46px;
    height:38px;
    border:1px solid #ccc;
    background:white;
    border-radius:10px;
    font-size:20px;
}

.order-item{
    border-bottom:1px solid #eee;
    padding:10px 0;
}

.qty-btn{
    width:30px;
    height:30px;
    border:none;
    background:#eee;
    border-radius:6px;
}

.total-box{
    background:#111;
    color:white;
    padding:12px;
    border-radius:10px;
}
</style>


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">


<div class="container py-4 billing-wrapper">
    <div class="container d-flex justify-content-end "><a href="/admin/bill" class="btn btn-danger mx-4 m-2  p-2 ">manage bills</a></div>

<div class="row g-4">

<!-- MENU -->
<div class="col-lg-6">
<div class="card-box">

<h4 >☰ Menu</h4>

<table class="table" >
<tr>
<th >Item</th>
<th>Price</th>
<th>Add</th>
</tr>

{% for item in menu_items %}
<tr>
<td>{{ item.item_name }}</td>
<td>₹{{ item.price }}</td>
<td>
<button type="button"
class="add-btn required"
onclick="addItem('{{ item.item_name }}','{{ item.price }}')">
+
</button>
</td>
</tr>
{% endfor %}

</table>

</div>
</div>

<!-- ORDER -->
<div class="col-lg-6">
<div class="card-box">

<h4>🧾 Order</h4>

<form method="POST">

<input type="text" name="customer_name" class="form-control mb-2" placeholder="Customer Name" >
<input type="text" name="phone_no" class="form-control mb-2" placeholder="Phone">

<select name="payment_method" class="form-control mb-2" required>
<option value="">Payment Method</option>
<option>Cash</option>
<option>GPay</option>
<option>PhonePe</option>
</select>

<select name="payment_status" class="form-control mb-3">
<option value="Paid">Paid</option>
<option value="Pending">Pending</option>
</select>

<!-- ORDER LIST -->
<div id="order-list" class="mb-3">
<div class="text-muted text-center">No items</div>
</div>

<!-- TOTAL -->
<div class="total-box d-flex justify-content-between">
<b>Total</b>
<h5 id="grand-total">₹0</h5>
</div>

<input type="hidden" name="total_amount" id="total-input" value="0">

<button class="btn btn-success w-100 mt-3" type="submit">
Submit Bill
</button>

</form>

</div>
</div>

</div>
</div>

<script>

let order = [];

function addItem(name, price){

    let existing = order.find(i => i.name === name);

    if(existing){
        existing.qty++;
    }else{
        order.push({name, price:parseFloat(price), qty:1});
    }

    render();
}

function changeQty(i, val){
    order[i].qty += val;
    if(order[i].qty <= 0){
        order.splice(i,1);
    }
    render();
}

function render(){

    let box = document.getElementById("order-list");

    if(order.length === 0){
        box.innerHTML = "<div class='text-center text-muted'>No items</div>";
        document.getElementById("grand-total").innerText = "₹0";
        document.getElementById("total-input").value = 0;
        return;
    }

    let total = 0;
    box.innerHTML = "";

    order.forEach((item, index)=>{

        let sub = item.price * item.qty;
        total += sub;

        box.innerHTML += `
        <div class="order-item">
            <div class="d-flex justify-content-between align-items-center">

                <div>
                    <b>${item.name}</b><br>
                    <small>₹${item.price}</small>
                </div>

                <div>
                    <button type="button" class="qty-btn" onclick="changeQty(${index},-1)">-</button>
                    <b>${item.qty}</b>
                    <button type="button" class="qty-btn" onclick="changeQty(${index},1)">+</button>
                </div>

                <div>
                    ₹${sub}
                </div>

            </div>

            <input type="hidden" name="item_name" value="${item.name}">
            <input type="hidden" name="price" value="${item.price}">
            <input type="hidden" name="quantity" value="${item.qty}">
        </div>
        `;
    });

    document.getElementById("grand-total").innerText = "₹" + total;
    document.getElementById("total-input").value = total;
}

</script>

{% endblock %}
