{% extends "base.html" %}

{% block content %}

<head><title>Add Worker</title></head>
<body>
    <div class="container">
        <h1 class="display-5 my-2" style="color: #ff6600;">Add Worker</h1>
        <p>Fill the form to add worker </p>
    </div>
    
    <div class="container">
        <form method="POST" action="/admin/add-worker">
        <div class="row">
        <div class="col-12 col-lg-6 mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="col-12 col-lg-6 mb-3">
            <label for="phone" class="form-label">Phone No</label>
            <input type="text" class="form-control" id="phone" name="phone" required>
        </div>
    </div>
    <div class="row">
        <div class="col-12 col-lg-6 mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" name="address" required>
        </div>
        <div class="col-12 col-lg-6 mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status" required>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-12 col-lg-6 mb-3">
            <label>Username</label>
            <input type="text"
                name="username"
                class="form-control"
                required>
        </div>

        <div class="col-12 col-lg-6 mb-3">
            <label>Password</label>
            <input type="password"
                name="password"
                class="form-control"
                required>
        </div>
        </div>
    
        <button type="submit" class="btn btn-primary mt-3">Add Worker</button>
        </form>
    </div>


{% endblock %}
