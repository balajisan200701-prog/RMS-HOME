{% extends "base.html" %}

{% block content %}




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
   

    <div class="container">
    <h1 class="display-5 my-2" style="color: #ff6600;">Add Menu </h1>
    <p>Add menu here</p>
  </div>

        <div class="container mt-5">
    <form action="/admin/add-menu" method="POST"  enctype="multipart/form-data">
                   
        <div class="row">

            <div class="col-md-6">

               <label for="item_name" class="form-label">Item Name</label>

                <input type="text"
                       name="item_name"
                       class="form-control my-3"
                       placeholder="Item Name"
                       required>

                </div>

            <div class="col-md-6">

                  <label for="category" class="form-label">Category</label>

                    <select name="category" class="from-control w-100 py-2 text-secondary my-2 rounded ">
                        <option value="Veg">Veg</option>
                        <option value="Non veg">Non veg</option>
                        <option value="Juice">Juice</option>
                        <option value="Dessert">Dessert</option>
                    </select><br>

            </div>

        </div>

            <div class="row">

                <div class="col-md-6">

                    <label for="price" class="form-label">Price</label>

                     <input type="number"
                       name="price"
                       class="form-control my-3"
                       placeholder="Price">

                </div>

                <div class="col-md-6">

                <label for="description" class="form-label">Description</label>

                <input type="text"
                       name="description"
                       class="form-control my-3"
                       placeholder="Description">
                </div>

            </div>

            <div class="row">

                <div class="col-md-6">

             <label for="image" class="form-label">Image</label>

              <input type="file"
              name="image"
              class="form-control my-3">

              </div>

              <div class="col-md-6">

                <label for="status" class="form-label">Status</label>

                <select name="status" class="from-control w-100 py-2 text-secondary my-2 rounded ">
                    <option value="Available">Available</option>
                    <option value="Out of Stock">Out of Stock</option>
                </select><br>

                </div>

            </div>
           
         
              <button type="submit" class="btn btn-success my-3" style="width: 20%;">
                  Add
              </button>

       

    </form>

    <hr>


</div>
</body>
</html>


{% endblock %}
