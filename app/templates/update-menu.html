{% extends "base.html" %}

{% block content %}




<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
      <div class="container">
    <h1 class="display-5 my-2" style="color: #ff6600;">Update Menu</h1>
    <p>Update your menu here</p>
  </div>

        <div class="container mt-5">
    <form method="POST" enctype="multipart/form-data">

        

            
                <input type="text"
                       name="item_name"
                       class="form-control my-3"
                       placeholder="Item Name"
                       value="{{ item.item_name }}"
                       required>
          
                
                    <select name="category" value="{{item.item_category}} "class="from-control w-100 py-2 text-secondary my-2 rounded ">
                        <option value="Veg">Veg</option>
                        <option value="Non veg">Non veg</option>
                        <option value="Juice">Juice</option>
                        <option value="Dessert">Dessert</option>
                    </select><br>
            

            
                <input type="number"
                       name="price"
                       class="form-control my-3"
                       placeholder="Price"
                        value="{{ item.price }}">
           

          
                <input type="text"
                       name="description"
                       class="form-control my-3"
                       placeholder="Description"
                       value="{{ item.description }}">
            

                  <img src="{{ url_for('static', filename='images/uploads/' + item.image) }}"
     width="100">

<input type="file" name="image" class="form-control">
          
               <select name="status"
            class="form-select my-3 w-100 py-2 text-secondary rounded">

        <option value="available"
        {% if item.status == 'available' %}
        selected
        {% endif %}>
            Available
        </option>

        <option value="out of stock"
        {% if item.status == 'out of stock' %}
        selected
        {% endif %}>
            Out of Stock
        </option>

    </select>
         
            
                <button type="submit" class="btn btn-success my-3">
                    Update
                </button>
         

        

    </form>

    <hr>


</div>
</body>
</html>


{% endblock %}
