
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #ff6600,
                #ff944d
            );

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

        }

        .login-card {

            width: 100%;

            max-width: 420px;

            border: none;

            border-radius: 20px;

            overflow: hidden;

            background: white;

        }

        .login-header {

            background: #ff6600;

            color: white;

            padding: 30px;

            text-align: center;

        }

        .login-header h2 {

            font-weight: bold;

            margin-bottom: 10px;

        }

        .login-header p {

            margin: 0;

            opacity: 0.9;

        }

        .form-control {

            height: 50px;

            border-radius: 12px;

        }

        .input-group-text {

            border-radius: 12px 0 0 12px;

            background: #fff3e6;

            border-right: none;

        }

        .form-control:focus {

            box-shadow: none;

            border-color: #ff6600;

        }

        .btn-login {

            background: #ff6600;

            border: none;

            height: 50px;

            border-radius: 12px;

            font-weight: bold;

            transition: 0.3s;

        }

        .btn-login:hover {

            background: #e65c00;

        }

        .logo {

            font-size: 55px;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-lg login-card">

                <!-- HEADER -->
                <div class="login-header">

                    <div class="logo">
                        🍴
                    </div>

                    <h2>Foodie Restro</h2>

                    <p>Admin Login Panel</p>

                </div>

                <!-- BODY -->
                <div class="card-body p-4">

                    <form method="POST">

                        <!-- USERNAME -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Username
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-person-fill"></i>

                                </span>

                                <input type="text"
                                       name="username"
                                       class="form-control"
                                       placeholder="Enter username"
                                       required>

                            </div>

                        </div>

                        <!-- PASSWORD -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock-fill"></i>

                                </span>

                                <input type="password"
                                       name="password"
                                       class="form-control"
                                       placeholder="Enter password"
                                       required>

                            </div>

                        </div>

                        <!-- BUTTON -->
                        <button type="submit"
                                class="btn btn-login text-white w-100">

                            <i class="bi bi-box-arrow-in-right"></i>

                            Login

                        </button>

                    </form>

                </div>

                <!-- FOOTER -->
                <div class="text-center pb-4 text-muted">

                    © 2026 Foodie Restro

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
